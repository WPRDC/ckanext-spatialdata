name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Keep the CKAN version of this image and the services in step.
      image: ckan/ckan-dev:2.12
      options: --user root
    services:
      # Provides the ckan_test database (user ckan_default, password pass).
      postgres:
        image: ckan/ckan-postgres-dev:2.12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      solr:
        image: ckan/ckan-solr:2.12-solr9
      redis:
        image: redis:6

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Install requirements
        run: |
          pip install -r requirements.txt
          pip install -r dev_requirements.txt
          pip install -e .

      - name: Set up CKAN test database
        run: |
          # test.ini's path to CKAN's test-core.ini fits the ckan-docker dev
          # container; point it at CKAN in this image.
          sed -i -e 's|^use = config:.*|use = config:/srv/app/src/ckan/test-core.ini|' test.ini
          ckan -c test.ini db init

      - name: Run tests
        run: pytest --ckan-ini=test.ini --cov=ckanext.spatialdata --cov-report=term-missing --disable-warnings ckanext/spatialdata/tests
