[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = ckan@localhost

[app:main]
# CKAN core's test config. This path fits the ckan-docker dev container
# (extension in /srv/app/src_extensions, CKAN in /srv/app/src/ckan); point it
# at your CKAN checkout's test-core.ini elsewhere.
use = config:../../src/ckan/test-core.ini

# The tests are unit tests: they load no plugins and use no database. Tests
# that need the plugin instantiate it directly.
ckan.plugins =

# Logging configuration
[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
